[project]
name = "cag-fastapi"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "masoomtariq", email = "mmasoomtariq@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "asyncio>=4.0.0",
    "bs4>=0.0.2",
    "colorlog>=6.12.0",
    "datetime>=6.0",
    "ebooklib>=0.20",
    "fastapi>=0.141.1",
    "google-genai>=2.24.0",
    "gunicorn>=26.2.0",
    "jinja2>=3.1.6",
    "motor>=3.7.1",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "pathlib>=1.0.1",
    "pdf2image>=1.17.0",
    "pypdf>=6.19.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "python-pptx>=1.0.2",
    "uvicorn>=0.53.0",
    "xlrd>=2.0.2",
]

[project.scripts]
cag-fastapi = "cag_fastapi:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
